name: home-alarm
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    restart: unless-stopped
    environment:
      TZ: America/Toronto
    ports:
      - "${HA_BIND_IP:-127.0.0.1}:8123:8123"
    volumes:
      - ./runtime/config:/config
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
